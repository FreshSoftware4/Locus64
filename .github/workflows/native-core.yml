name: Native core gate

on:
  pull_request:
    branches:
      - main
      - 'chatgpt/**'
    paths:
      - Cargo.toml
      - Cargo.lock
      - l64-symbolic/**
      - l64-native/**
      - l64-projection/**
      - l64-core/**
      - l64-cli/**
      - LOCUS64_*_RAIL.athens
      - LOCUS64_*_CHANGE_CHAIN.athens
      - .github/workflows/native-core.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export governed source
        run: tar --exclude=.git --exclude=target -czf /tmp/locus64-governed-source.tgz .

      - name: Upload governed source
        uses: actions/upload-artifact@v4
        with:
          name: locus64-governed-source-pass12-bootstrap
          path: /tmp/locus64-governed-source.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test workspace
        run: cargo test -q

      - name: Lint native symbolic spine
        run: cargo clippy -p l64-symbolic -p l64-native -p l64-projection --all-targets -- -D warnings
