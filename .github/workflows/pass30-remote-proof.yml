name: Pass 30 remote proof

on:
  push:
    branches:
      - agent/residue-remote-proof-pass30
  pull_request:
    branches:
      - chatgpt/legacy-blake3-removal-pass12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portability:
    name: ${{ matrix.host_label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host_label: ubuntu-latest
          - os: macos-latest
            host_label: macos-latest
          - os: windows-latest
            host_label: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout proof carrier
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Reconstruct Pass 30 executable workspace
        shell: bash
        env:
          DELTA_SHA256: eb1c9e98091269b1e7e07e3bb82b396aea06130c2350aef82794cd8d0b17f8c0
          FIXTURE_SHA256: 2b9cdafc3978f859c8c122bd5b3bc643091295ffee71d0d9f629c00db53a2114
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path
          import shutil
          import tarfile

          root = Path.cwd()
          parts = sorted((root / "remote-proof").glob("delta.part*.b64"))
          if len(parts) != 11:
              raise SystemExit(f"expected 11 delta parts, found {len(parts)}")
          encoded = b"".join(part.read_bytes() for part in parts)
          delta = base64.b64decode(encoded, validate=True)
          expected = os.environ["DELTA_SHA256"]
          actual = hashlib.sha256(delta).hexdigest()
          if actual != expected:
              raise SystemExit(f"delta hash mismatch: expected {expected}, got {actual}")

          staging = Path(os.environ["RUNNER_TEMP"]) / "locus64-pass30-delta"
          if staging.exists():
              shutil.rmtree(staging)
          staging.mkdir(parents=True)
          archive = staging / "delta.tar.xz"
          archive.write_bytes(delta)
          extracted = staging / "extracted"
          extracted.mkdir()
          with tarfile.open(archive, "r:xz") as tf:
              tf.extractall(extracted)

          deleted = extracted / "deleted.txt"
          for line in deleted.read_text(encoding="utf-8").splitlines():
              if not line:
                  continue
              target = root / line
              if target.is_dir():
                  shutil.rmtree(target)
              elif target.exists() or target.is_symlink():
                  target.unlink()

          overlay = extracted / "overlay"
          shutil.copytree(overlay, root, dirs_exist_ok=True)
          for retired in [
              "l64-core", "l64-locus", "l64-research", "l64-kernel",
              "l64-command", "l64-registry", "l64-selector", "l64-runtime",
              "l64-canon", "l64-atlas", "l64-cert", "l64-testkit",
          ]:
              shutil.rmtree(root / retired, ignore_errors=True)

          fixture_encoded = (root / "remote-proof/current-samples.tar.xz.b64").read_bytes()
          fixture = base64.b64decode(fixture_encoded, validate=True)
          fixture_expected = os.environ["FIXTURE_SHA256"]
          fixture_actual = hashlib.sha256(fixture).hexdigest()
          if fixture_actual != fixture_expected:
              raise SystemExit(
                  f"fixture hash mismatch: expected {fixture_expected}, got {fixture_actual}"
              )
          fixture_archive = staging / "current-samples.tar.xz"
          fixture_archive.write_bytes(fixture)
          shutil.rmtree(root / "samples", ignore_errors=True)
          with tarfile.open(fixture_archive, "r:xz") as tf:
              tf.extractall(root)
          PY

      - name: Test exact executable workspace
        shell: bash
        run: cargo test --locked --offline --workspace

      - name: Write source-bound receipt
        shell: bash
        env:
          HOST_LABEL: ${{ matrix.host_label }}
          FULL_SOURCE_SHA256: 0b4af31494ec25c8fbc66f2a8f4383af34f76f304751828c57e8c3756cbafda2
          BASE_COMMIT: 0ee9274c9ae4b574d89f94cfa2ae13078d28cbed
          DELTA_SHA256: eb1c9e98091269b1e7e07e3bb82b396aea06130c2350aef82794cd8d0b17f8c0
          FIXTURE_SHA256: 2b9cdafc3978f859c8c122bd5b3bc643091295ffee71d0d9f629c00db53a2114
        run: |
          mkdir -p receipts
          rustc -vV > "$RUNNER_TEMP/rustc-version.txt"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          rustc = Path(os.environ["RUNNER_TEMP"]).joinpath("rustc-version.txt").read_text(encoding="utf-8").strip()
          receipt = {
              "schema": "L64PORT1",
              "proof_scope": "pass30-executable-workspace",
              "source_ref": "archive-sha256:" + os.environ["FULL_SOURCE_SHA256"],
              "full_source_archive_sha256": os.environ["FULL_SOURCE_SHA256"],
              "base_commit": os.environ["BASE_COMMIT"],
              "executable_delta_sha256": os.environ["DELTA_SHA256"],
              "fixture_archive_sha256": os.environ["FIXTURE_SHA256"],
              "host_label": os.environ["HOST_LABEL"],
              "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
              "rustc": rustc,
              "package_count": 11,
              "external_dependencies": 0,
              "test_command": "cargo test --locked --offline --workspace",
              "result": "pass",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "head_sha": os.environ["GITHUB_SHA"],
          }
          out = Path("receipts") / f"portability-{os.environ['HOST_LABEL']}.json"
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload host receipt
        uses: actions/upload-artifact@v4
        with:
          name: pass30-portability-${{ matrix.host_label }}
          path: receipts/portability-${{ matrix.host_label }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: aggregate receipts
    needs: portability
    runs-on: ubuntu-latest
    steps:
      - name: Download host receipts
        uses: actions/download-artifact@v4
        with:
          pattern: pass30-portability-*
          path: receipts
          merge-multiple: true

      - name: Verify receipt convergence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("receipts").glob("portability-*.json"))
          if len(files) != 3:
              raise SystemExit(f"expected 3 receipts, found {len(files)}")
          receipts = [json.loads(path.read_text(encoding="utf-8")) for path in files]
          expected_hosts = {"ubuntu-latest", "macos-latest", "windows-latest"}
          hosts = {r["host_label"] for r in receipts}
          if hosts != expected_hosts:
              raise SystemExit(f"host set mismatch: {hosts}")
          invariant_fields = [
              "schema", "proof_scope", "source_ref", "full_source_archive_sha256",
              "base_commit", "executable_delta_sha256", "fixture_archive_sha256",
              "package_count",
              "external_dependencies", "test_command", "result", "head_sha",
          ]
          for field in invariant_fields:
              values = {json.dumps(r[field], sort_keys=True) for r in receipts}
              if len(values) != 1:
                  raise SystemExit(f"receipt divergence in {field}: {values}")
          if any(r["result"] != "pass" for r in receipts):
              raise SystemExit("non-passing receipt")
          summary = {
              "schema": "L64PORTSET1",
              "proof_scope": receipts[0]["proof_scope"],
              "source_ref": receipts[0]["source_ref"],
              "base_commit": receipts[0]["base_commit"],
              "executable_delta_sha256": receipts[0]["executable_delta_sha256"],
              "fixture_archive_sha256": receipts[0]["fixture_archive_sha256"],
              "hosts": sorted(hosts),
              "result": "pass",
              "receipts": [path.name for path in files],
          }
          Path("receipts/portability-set.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload converged receipt set
        uses: actions/upload-artifact@v4
        with:
          name: locus64-pass30-portability-receipts
          path: receipts/*.json
          if-no-files-found: error
          retention-days: 90
