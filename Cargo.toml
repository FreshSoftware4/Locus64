[workspace]
resolver = "2"
members = [
    "l64-symbolic",
    "l64-native",
    "l64-projection",
    "l64-release",
    "l64-execution",
    "l64-transport",
    "l64-certification",
    "l64-observation",
    "l64-change",
    "l64-cli",
    "l64",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.perfopt]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.compact]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
